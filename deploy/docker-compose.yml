# 운영 서버(가비아)에서 실행한다: Caddy(HTTPS) → 앱 → PostgreSQL
# 같은 폴더의 .env(서버에만 있음)에서 DB 비밀번호, 구글 OAuth 키, 도메인, 이미지 이름을 읽는다.

# 컨테이너 로그(json-file)가 디스크를 채우지 않게 서비스마다 10MB × 5개까지만 둔다(docker compose logs로 본다).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      # actuator 관리 포트(헬스·지표, 인증 없음). 서버 안(127.0.0.1)에서만 열어 Netdata가 지표를 읽는다(docs/DEPLOY.md 「모니터링」).
      # 인터넷에는 Caddy(80·443)만 열리고, Caddy는 앱 포트(8080)만 프록시한다.
      # 127.0.0.1을 빼면 안 된다: Docker가 연 포트는 ufw 규칙을 거치지 않아 바로 공개된다.
      - "127.0.0.1:8081:8081"
    logging: *logging
    volumes:
      # 올린 프로필 사진(이미지의 PHOTOS_DIR). backup.sh가 DB와 함께 백업한다.
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 버전별 폴더를 만든다.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_APEX_DOMAIN: ${APP_APEX_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  photos:
  caddy-data:
  caddy-config:
