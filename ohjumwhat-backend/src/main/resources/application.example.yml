# 이 파일을 복사해 application.yml로 저장해 사용한다. application.yml은 git에 올리지 않는다.
# 민감한 값은 여기에 직접 쓰지 않고 환경변수(.env)로 주입한다.
spring:
  application:
    name: ohjumwhat
  config:
    # 로컬 bootRun 시 루트의 .env를 읽는다. 운영(Docker)에서는 env_file로 주입된다.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ohjumwhat}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # 프로필 사진·채팅 사진 올리기. 브라우저가 줄여 보낸다(프로필 512px, 채팅 긴 변 1600px JPEG, 대개 1MB 이하).
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

server:
  # Caddy / Vite 프록시 뒤에서 원래 호스트·프로토콜로 리디렉션 URI를 만든다.
  forward-headers-strategy: framework
  servlet:
    session:
      # 세션은 DB(spring_session)에 저장한다. 브라우저를 닫아도 30일간 로그인이 유지된다.
      timeout: 30d
      cookie:
        max-age: 30d
        same-site: lax
        http-only: true

management:
  # actuator(헬스·지표)는 관리 포트에서만 연다. Caddy는 앱 포트(8080)만 프록시하므로 지표는 인터넷에 나가지 않는다.
  # 관리 포트는 인증 없이 열리므로(보안 설정이 /api/**만 막는다) 네트워크로만 막는다: 운영 compose는 서버의 127.0.0.1에만
  # 열고, 서버의 Netdata가 지표를 읽는다(docs/DEPLOY.md 「모니터링」). 이 설정은 ManagementConfigTest가 지킨다.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      group:
        # 외부 업타임 체크·배포 헬스 체크용. 앱 포트의 /healthz로 상태(UP/DOWN)만 준다(자세한 내용은 숨긴다).
        # DB·디스크·준비 상태만 본다(시작·종료 중에는 503). 새 의존성이 생겨도 저절로 들어오지 않게 하나씩 적는다.
        public:
          include: db, diskSpace, readinessState
          additional-path: "server:/healthz"
  metrics:
    enable:
      # 저장소 메서드 호출 지표(spring.data.repository.invocations)는 보지 않고 시계열만 늘려서 끈다.
      spring.data.repository: false

ohjumwhat:
  admin:
    # 관리자 계정 이메일(쉼표로 여러 개). 서버 시작·로그인 때 이 계정을 관리자로 지정하고, 목록에 없는 관리자는 해제한다.
    # 저장소가 공개라 이메일은 여기 쓰지 않고 .env(ADMIN_EMAILS)로 넣는다. 비어 있으면 관리자 목록을 바꾸지 않는다.
    emails: ${ADMIN_EMAILS:}
  maps:
    # 카카오 로컬 REST API 키(https://developers.kakao.com, 앱 설정에서 「카카오맵」을 켜야 한다). 서버에서만 쓴다.
    # 회사·식당 주소를 좌표로 바꾸고 근처 식당을 찾는다. 비어 있으면 지도·근처 식당 찾기를 끈다.
    kakao-rest-key: ${KAKAO_REST_KEY:}
    # 네이버 지도(NCP Maps) Client ID. 브라우저가 지도 스크립트를 부를 때 쓰는 공개 값이고, NCP 콘솔에 등록한 도메인에서만 동작한다.
    naver-map-key-id: ${NAVER_MAP_KEY_ID:}
  push:
    # 웹 푸시(FCM, 새 방명록·쪽지 알림). 하나라도 비었거나 서비스 계정을 읽지 못하면 푸시를 끄고 서버는 그대로 뜬다.
    web:
      # 화면이 Firebase SDK를 초기화할 공개 값(GET /api/config로 준다). Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹 앱)
      api-key: ${FIREBASE_API_KEY:}
      project-id: ${FIREBASE_PROJECT_ID:}
      app-id: ${FIREBASE_APP_ID:}
      messaging-sender-id: ${FIREBASE_MESSAGING_SENDER_ID:}
      # 웹 푸시 인증서(VAPID)의 공개 키. Firebase 콘솔 → 프로젝트 설정 → 클라우드 메시징 → 웹 구성
      vapid-key: ${FIREBASE_VAPID_KEY:}
    # 비밀 값. 서비스 계정 JSON을 base64 한 줄로 넣는다(base64 -i key.json | tr -d '\n'). 서버에서만 쓴다.
    # 서비스 계정의 project_id가 위 project-id와 달라도 푸시를 끈다.
    service-account: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  photos:
    # 올린 프로필 사진({키}.jpg)을 두는 폴더. 운영은 Docker 볼륨(/data/photos, Dockerfile의 PHOTOS_DIR)이고,
    # 로컬은 백엔드 폴더의 data/photos(gitignore 대상)다. 백업은 deploy/backup.sh가 DB와 함께 한다.
    dir: ${PHOTOS_DIR:./data/photos}
  chat-photos:
    # 채팅 사진({키}.jpg 원본, {키}_t.jpg 썸네일)을 두는 폴더. 비우면 프로필 사진 폴더 아래 chat이다(운영 /data/photos/chat).
    # 30일 보관하고 매일 04:00에 정리한다. 30일이면 지워지는 사진이라 deploy/backup.sh는 이 폴더를 백업하지 않는다.
    dir: ${CHAT_PHOTOS_DIR:}
