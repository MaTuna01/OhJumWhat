# 이 파일을 복사해 application.yml로 저장해 사용한다. application.yml은 git에 올리지 않는다.
# 민감한 값은 여기에 직접 쓰지 않고 환경변수(.env)로 주입한다.
spring:
  application:
    name: ohjumwhat
  config:
    # 로컬 bootRun 시 루트의 .env를 읽는다. 운영(Docker)에서는 env_file로 주입된다.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ohjumwhat}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

server:
  # Caddy / Vite 프록시 뒤에서 원래 호스트·프로토콜로 리디렉션 URI를 만든다.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health
