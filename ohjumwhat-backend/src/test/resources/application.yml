# 테스트 전용 설정. DB는 Testcontainers(@ServiceConnection)로 주입된다.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid,profile,email

# 백그라운드 스케줄러는 끄고, 테스트에서 ScheduledPollOpener를 고정된 시계로 직접 호출한다.
ohjumwhat:
  scheduler:
    enabled: false
  # 관리자 이메일(테스트용). 이 이메일로 인증된 구글 로그인을 하면 관리자가 된다.
  admin:
    emails: admin@example.com
