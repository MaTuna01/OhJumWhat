# 테스트 전용 설정. DB는 Testcontainers(@ServiceConnection)로 주입된다.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid,profile,email

# 백그라운드 스케줄러는 끄고, 테스트에서 ScheduledPollOpener를 고정된 시계로 직접 호출한다.
ohjumwhat:
  scheduler:
    enabled: false
  # 서버 시작 때의 업데이트 글 자동 게시도 끈다. 시작 때 넣은 행이 첫 테스트까지 남아 결과를 흔들기 때문이다.
  # 테스트에서는 NoticeService.syncReleaseNotes를 직접 부른다.
  release-notes:
    enabled: false
  # 관리자 이메일(테스트용). 이 이메일로 인증된 구글 로그인을 하면 관리자가 된다.
  admin:
    emails: admin@example.com
  # 지도 키(테스트용). 통합 테스트는 카카오 로컬을 가짜(FakeKakaoLocalConfiguration)로 바꾼다.
  maps:
    kakao-rest-key: test-kakao-key
    naver-map-key-id: test-naver-key
  # 프로필 사진 폴더(테스트용). build 아래라 git·Docker에 들어가지 않고, IntegrationTest가 테스트마다 비운다.
  photos:
    dir: build/test-photos
