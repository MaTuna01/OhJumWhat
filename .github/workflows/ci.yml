# 모든 PR과 dev 브랜치에서 백엔드·프론트 테스트를 돌린다. 배포 워크플로도 이것을 먼저 호출한다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ohjumwhat-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers가 러너의 Docker로 PostgreSQL을 띄운다. application.yml 없이 테스트 설정만으로 돈다.
      - run: ./gradlew test --no-daemon

  frontend:
    name: 프론트 린트·테스트·빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ohjumwhat-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ohjumwhat-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
