# main에 push하면 테스트 → 이미지 빌드·GHCR push → 가비아 서버에 SSH로 배포한다.
# 필요한 저장소 Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (docs/DEPLOY.md 참고)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: 이미지 빌드·푸시
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 이름 (GHCR은 소문자만 허용)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ohjumwhat" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 패키지를 이 저장소에 연결해서, 배포 단계의 GITHUB_TOKEN으로 pull할 수 있게 한다.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버 배포
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: 배포 파일 복사 (docker-compose.yml, Caddyfile, backup.sh)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/backup.sh
          target: ohjumwhat
          strip_components: 1
      - name: 새 이미지로 교체
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/ohjumwhat
            test -f .env || { echo "~/ohjumwhat/.env가 없습니다. docs/DEPLOY.md를 보고 먼저 만들어 주세요."; exit 1; }
            chmod +x backup.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            # 앱이 뜰 때까지 최대 2분 기다린다(Caddy 컨테이너에서 내부 주소로 확인).
            for i in $(seq 1 40); do
              if docker compose exec -T caddy wget -qO- http://app:8080/actuator/health 2>/dev/null | grep -q '"UP"'; then
                echo "배포 완료: 앱이 정상입니다."
                docker image prune -f > /dev/null
                exit 0
              fi
              sleep 3
            done
            echo "앱이 정상 상태가 되지 않았습니다. 최근 로그:"
            docker compose logs --tail 80 app
            exit 1
